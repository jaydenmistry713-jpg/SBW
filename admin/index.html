<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | SBW Events CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
</head>
<body class="admin-page">

  <div class="admin-login-page">
    <div class="admin-login-card">
      <div class="admin-login-card__logo">
        <img src="/logo.png" alt="SBW Events" width="96" height="96">
      </div>
      <h1 id="login-title">CMS Login</h1>
      <p class="subtitle" id="login-subtitle">Sign in to manage your website content.</p>

      <div class="login-error" id="login-error" style="display:none;" role="alert"></div>
      <div class="login-notice" id="login-notice" hidden role="status"></div>

      <!-- Sign in -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--green admin-login-card__submit">Sign In</button>
        <button type="button" class="admin-login-card__link" data-login-view="forgot">Forgot your password?</button>
      </form>

      <!-- Request a reset link -->
      <form id="forgot-form" novalidate hidden>
        <div class="form-group">
          <label for="forgot-email">Email Address</label>
          <input type="email" id="forgot-email" class="form-control" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn--green admin-login-card__submit">Email Me a Reset Link</button>
        <button type="button" class="admin-login-card__link" data-login-view="login">&larr; Back to sign in</button>
      </form>

      <!-- Set a new password (shown when arriving from the reset email) -->
      <form id="reset-form" novalidate hidden>
        <div class="form-group">
          <label for="reset-password">New Password</label>
          <input type="password" id="reset-password" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="reset-password-confirm">Confirm New Password</label>
          <input type="password" id="reset-password-confirm" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--green admin-login-card__submit">Save Password &amp; Sign In</button>
      </form>

      <p class="admin-login-card__back">
        <a href="/">&larr; Back to sbwevents.co.uk</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
