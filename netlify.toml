[build]
  publish = "/"

[images]
  remote_images = ["^https://ryvmutpznmjphyghmqvu\\.supabase\\.co/storage/v1/object/public/.*"]

# The repo root is the publish directory, so keep internal files private.
# (Functions are deployed separately — their source shouldn't be downloadable.)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fix_encoding.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md%20%E2%80%94%20SBW%20Events%20v3.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SBW%20Events%20%E2%80%93%20PRD%20v3.docx"
  to = "/404.html"
  status = 404
  force = true

# package.json exists only so Netlify installs @netlify/blobs for the
# /dashboard statistics functions (2026-11-08). None of it is for visitors.
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# Send the default Netlify subdomain to the custom domain so Google only
# indexes one copy of the site. (www -> apex is handled by Netlify's primary
# domain setting.) Requires HTTPS to be active on sbwevents.co.uk.
[[redirects]]
  from = "https://sbweventslive.netlify.app/*"
  to = "https://sbwevents.co.uk/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Jayden's visitor statistics (2026-11-08). Not linked from anywhere, never
# indexed, never cached. Password: DASHBOARD_PASSWORD env var.
[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
